# Staging: same layout as production (web + db + nginx).
# GitHub Actions builds and pushes image to Docker Hub; server pulls and runs.
# For local staging with build: docker compose -f docker-compose-staging.yml up --build -d

services:
  web:
    image: fcgurus/floripacodegurus-site:staging
    build: .
    restart: unless-stopped
    command: gunicorn configs.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=configs.settings.staging
      - ENV_NAME=staging
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data/
    env_file:
      - .env.staging
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-staging.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data_staging:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
