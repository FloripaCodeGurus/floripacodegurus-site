# Deploy production to DigitalOcean Droplet (push to main)
# Requires: DEPLOY_HOST (or DEPLOY_HOST_PROD), DEPLOY_SSH_KEY; optional: DEPLOY_USER

name: Deploy Production (DigitalOcean Droplet)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/floripacodegurus || { echo "Directory /opt/floripacodegurus missing. Run setup-server.sh and clone repo first."; exit 1; }
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose-production.yml up -d --build
            docker compose -f docker-compose-production.yml exec -T web python manage.py migrate --noinput || true
            docker compose -f docker-compose-production.yml exec -T web python manage.py collectstatic --noinput || true
