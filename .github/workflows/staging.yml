# Deploy staging to DigitalOcean Droplet (push to staging branch)
# Requires: DEPLOY_HOST_STG, DEPLOY_SSH_KEY, DOCKERHUB_USERNAME, DOCKERHUB_STAGING_DEPLOY_KEY

name: Deploy Staging (DigitalOcean Droplet)

on:
  push:
    branches:
      - staging

env:
  DOCKER_IMAGE: fcgurus/floripacodegurus-site
  DOCKER_TAG: staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_STAGING_DEPLOY_KEY }}" ]; then
            echo "::error::Add repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_STAGING_DEPLOY_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_STAGING_DEPLOY_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_STG }}
          username: ${{ secrets.DEPLOY_USER_STG != '' && secrets.DEPLOY_USER_STG || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/floripacodegurus-staging || { echo "Directory missing. Create it and clone repo (see GITHUB_ACTIONS_SETUP.md)."; exit 1; }
            git fetch origin staging && git reset --hard origin/staging
            docker compose -f docker-compose-staging.yml pull web
            docker compose -f docker-compose-staging.yml up -d
            docker compose -f docker-compose-staging.yml exec -T web python manage.py migrate --noinput || true
            docker compose -f docker-compose-staging.yml exec -T web python manage.py collectstatic --noinput || true
